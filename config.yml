app:
  name: XBank
  port: 3000

jwt:
  private_key_path: keys/private.pem
  public_key_path: keys/public.pem
  issuer: xbank-api
  audience: xbank-client
  access_ttl_minutes: 15
  refresh_ttl_days: 30

rate_limit:
  max_requests: 60
  window_minutes: 1

hmac:
  max_clock_skew_minutes: 5

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:5173

mongodb:
  database: xbank_audit

jaeger:
  enabled: true
  endpoint: localhost:4318

kafka:
  brokers:
    - localhost:9092
  topics:
    account_opened: xbank.accounts.opened
    account_credited: xbank.accounts.credited
    account_debited: xbank.accounts.debited
    account_frozen: xbank.accounts.frozen
    account_closed: xbank.accounts.closed
    transfer_created: xbank.transfers.created
    transfer_completed: xbank.transfers.completed
    transfer_failed: xbank.transfers.failed
    card_issued: xbank.cards.issued
    card_blocked: xbank.cards.blocked
    card_activated: xbank.cards.activated
    kyc_submitted: xbank.kyc.submitted
    kyc_approved: xbank.kyc.approved
    kyc_rejected: xbank.kyc.rejected
    notification_requested: xbank.notifications.requested
