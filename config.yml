app:
  name: XBank
  port: 3000

jwt:
  private_key_path: keys/private.pem
  public_key_path: keys/public.pem
  issuer: xbank-api
  audience: xbank-client
  access_ttl_minutes: 15
  refresh_ttl_days: 30

rate_limit:
  max_requests: 60
  window_minutes: 1

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:5173

mongodb:
  database: xbank_audit

kafka:
  brokers:
    - localhost:9092
  topics:
    account_opened: xbank.accounts.opened
    account_credited: xbank.accounts.credited
    account_debited: xbank.accounts.debited
    account_frozen: xbank.accounts.frozen
    account_closed: xbank.accounts.closed
    transfer_created: xbank.transfers.created
    transfer_completed: xbank.transfers.completed
    transfer_failed: xbank.transfers.failed
