app:
  name: XBank
  port: 3000

jwt:
  private_key_path: keys/private.pem
  public_key_path: keys/public.pem
  issuer: xbank-api
  audience: xbank-client
  access_ttl_minutes: 15
  refresh_ttl_days: 30

rate_limit:
  max_requests: 60
  window_minutes: 1

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:5173
