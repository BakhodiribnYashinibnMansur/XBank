name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/xbank ./cmd/app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbank-binary
          path: bin/xbank
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t xbank:${{ github.sha }} .

      - name: Verify image
        run: docker images xbank:${{ github.sha }}
