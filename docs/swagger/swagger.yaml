openapi: "3.0.3"
info:
  title: XBank API
  description: XBank Banking API - DDD Modular Monolith with Event Sourcing, CQRS, and Saga pattern
  version: "1.0"
  contact: {}
servers:
  - url: http://localhost:3000/api/v1
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT access token

  schemas:
    # ── Common ──────────────────────────────────────────────────
    Meta:
      type: object
      properties:
        request_id:
          type: string
        timestamp:
          type: string

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        code:
          type: integer
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
        meta:
          $ref: '#/components/schemas/Meta'

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    PaginationResponse:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64

    PaginatedResponse:
      type: object
      properties:
        data: {}
        pagination:
          $ref: '#/components/schemas/PaginationResponse'

    # ── IAM — Session ───────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/SessionUserResponse'
        totp_required:
          type: boolean

    SessionUserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        created_at:
          type: string

    TOTPVerifyLoginRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
        code:
          type: string

    TOTPSetupResponse:
      type: object
      properties:
        secret:
          type: string
        url:
          type: string

    TOTPVerifySetupRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    TOTPDisableRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    # ── IAM — User ──────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password, first_name]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
        new_password:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        created_at:
          type: string
          format: date-time

    # ── IAM — Challenge ─────────────────────────────────────────
    ChallengeRequestDTO:
      type: object
      required: [action]
      properties:
        method:
          type: string
          description: "PASSWORD or TOTP"
        action:
          type: string
        metadata:
          type: string

    ChallengeVerifyDTO:
      type: object
      required: [challenge_id, password]
      properties:
        challenge_id:
          type: string
        password:
          type: string

    ChallengeResponse:
      type: object
      properties:
        id:
          type: string
        method:
          type: string
        status:
          type: string
        action:
          type: string
        expires_at:
          type: string
          format: date-time

    ChallengeVerifiedResponse:
      type: object
      properties:
        challenge_id:
          type: string
        token:
          type: string
        expires_at:
          type: string
          format: date-time

    # ── IAM — Contact ───────────────────────────────────────────
    AddContactRequest:
      type: object
      required: [contact_id]
      properties:
        contact_id:
          type: string
        custom_name:
          type: string

    ContactResponse:
      type: object
      properties:
        id:
          type: string
        contact_id:
          type: string
        custom_name:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Banking — Account ───────────────────────────────────────
    CreateAccountRequest:
      type: object
      required: [currency]
      properties:
        currency:
          type: string
          description: "UZS, USD, EUR"

    DepositRequest:
      type: object
      required: [account_id, amount]
      properties:
        account_id:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount in minor units

    WithdrawRequest:
      type: object
      required: [account_id, amount]
      properties:
        account_id:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount in minor units

    CloseAccountRequest:
      type: object
      required: [account_id]
      properties:
        account_id:
          type: string

    AccountResponse:
      type: object
      properties:
        id:
          type: string
        account_number:
          type: string
        balance:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    AccountEventResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        data: {}
        version:
          type: integer
        occurred_at:
          type: string
          format: date-time

    # ── Banking — Transfer ──────────────────────────────────────
    SendTransferRequest:
      type: object
      required: [from_account_id, to_account_id, amount, currency]
      properties:
        from_account_id:
          type: string
        to_account_id:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        description:
          type: string

    ScheduleTransferRequest:
      type: object
      required: [from_account_id, to_account_id, amount, currency, execute_at]
      properties:
        from_account_id:
          type: string
        to_account_id:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        description:
          type: string
        execute_at:
          type: string
          format: date-time
          description: RFC3339 format

    TransferResponse:
      type: object
      properties:
        id:
          type: string
        from_account_id:
          type: string
        to_account_id:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        description:
          type: string
        failure_reason:
          type: string
        created_at:
          type: string
          format: date-time

    TransferEventResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        data: {}
        version:
          type: integer
        occurred_at:
          type: string
          format: date-time

    ScheduledTransferResponse:
      type: object
      properties:
        id:
          type: string
        from_account_id:
          type: string
        to_account_id:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        description:
          type: string
        status:
          type: string
        execute_at:
          type: string
        transfer_id:
          type: string
        failure_reason:
          type: string
        created_at:
          type: string

    # ── Banking — Card ──────────────────────────────────────────
    IssueCardRequest:
      type: object
      required: [account_id, card_type]
      properties:
        account_id:
          type: string
        card_type:
          type: string
          description: "DEBIT or VIRTUAL"

    ActivateCardRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          description: 4 digits

    VerifyPINRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string

    ChangePINRequest:
      type: object
      required: [old_pin, new_pin]
      properties:
        old_pin:
          type: string
        new_pin:
          type: string

    Enroll3DSRequest:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: '"2.1" or "2.2"'

    SetEMVRequest:
      type: object
      required: [aid]
      properties:
        aid:
          type: string
          description: 'e.g. "A0000000041010"'

    HoldRequest:
      type: object
      required: [card_id, account_id, merchant, amount, currency]
      properties:
        card_id:
          type: string
        account_id:
          type: string
        merchant:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string

    HoldResponse:
      type: object
      properties:
        id:
          type: string
        card_id:
          type: string
        account_id:
          type: string
        merchant:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        held_at:
          type: string
        expires_at:
          type: string

    TokenResponse:
      type: object
      properties:
        token:
          type: string
        card_id:
          type: string
        last_four:
          type: string
        is_active:
          type: boolean

    CardResponse:
      type: object
      properties:
        id:
          type: string
        account_id:
          type: string
        masked_pan:
          type: string
          description: PAN never returned in full
        expiry_month:
          type: integer
        expiry_year:
          type: integer
        card_type:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Banking — Beneficiary ───────────────────────────────────
    AddBeneficiaryRequest:
      type: object
      required: [name, account_number, bank_name, currency, type]
      properties:
        name:
          type: string
        account_number:
          type: string
        bank_name:
          type: string
        bank_code:
          type: string
        currency:
          type: string
        type:
          type: string
          description: "INTERNAL, EXTERNAL, INTERNATIONAL"

    BeneficiaryResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        account_number:
          type: string
        bank_name:
          type: string
        bank_code:
          type: string
        currency:
          type: string
        type:
          type: string
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ── Banking — Exchange ──────────────────────────────────────
    ConvertRequest:
      type: object
      required: [from, to, amount]
      properties:
        from:
          type: string
        to:
          type: string
        amount:
          type: integer
          format: int64

    ConvertResponse:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        original_amount:
          type: integer
          format: int64
        converted_amount:
          type: integer
          format: int64
        rate_used:
          type: integer
          format: int64

    UpsertRateRequest:
      type: object
      required: [from, to, buy_rate, sell_rate]
      properties:
        from:
          type: string
        to:
          type: string
        buy_rate:
          type: integer
          format: int64
        sell_rate:
          type: integer
          format: int64

    RateResponse:
      type: object
      properties:
        id:
          type: string
        from_currency:
          type: string
        to_currency:
          type: string
        buy_rate:
          type: integer
          format: int64
        sell_rate:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time

    # ── Banking — KYC ───────────────────────────────────────────
    KYCSubmitRequest:
      type: object
      required: [document_type, document_number, first_name, last_name, date_of_birth]
      properties:
        document_type:
          type: string
          description: "PASSPORT, ID_CARD, DRIVER_LICENSE"
        document_number:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
          description: YYYY-MM-DD

    KYCReviewRequest:
      type: object
      required: [verification_id]
      properties:
        verification_id:
          type: string
        reason:
          type: string
          description: Only required for reject

    KYCResponse:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        document_type:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        status:
          type: string
        rejected_reason:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Banking — Fraud ─────────────────────────────────────────
    FraudCheckResponse:
      type: object
      properties:
        id:
          type: string
        transfer_id:
          type: string
        user_id:
          type: string
        risk_score:
          type: integer
        risk_level:
          type: string
        action:
          type: string
        flags:
          type: array
          items:
            type: string
        reviewed_by:
          type: string
        review_comment:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Banking — Reconciliation ────────────────────────────────
    ReconciliationResult:
      type: object
      properties:
        account_id:
          type: string
        projected_balance:
          type: integer
          format: int64
        ledger_balance:
          type: integer
          format: int64
        match:
          type: boolean

    # ── Content — Notification ──────────────────────────────────
    NotificationResponse:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        title:
          type: string
        message:
          type: string
        type:
          type: string
          description: "INFO, WARNING, ALERT"
        read_at:
          type: string
          format: date-time
          nullable: true
        data:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time

    # ── Content — Translation ───────────────────────────────────
    CreateTranslationRequest:
      type: object
      required: [key, language, value, group]
      properties:
        key:
          type: string
        language:
          type: string
          description: "uz, ru, en"
        value:
          type: string
        group:
          type: string
          description: 'Logical grouping: "errors", "auth", "dashboard"'

    UpdateTranslationRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string

    TranslationResponse:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        language:
          type: string
        value:
          type: string
        group:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Content — Announcement ──────────────────────────────────
    CreateAnnouncementRequest:
      type: object
      properties:
        title_uz:
          type: string
        title_ru:
          type: string
        title_en:
          type: string
        body_uz:
          type: string
        body_ru:
          type: string
        body_en:
          type: string
        priority:
          type: integer
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time

    AnnouncementResponse:
      type: object
      properties:
        id:
          type: string
        title_uz:
          type: string
        title_ru:
          type: string
        title_en:
          type: string
        body_uz:
          type: string
        body_ru:
          type: string
        body_en:
          type: string
        priority:
          type: integer
        status:
          type: string
          description: "DRAFT or PUBLISHED"
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Admin — Feature Flag ────────────────────────────────────
    CreateFlagRequest:
      type: object
      required: [key, flag_type, default_value]
      properties:
        key:
          type: string
        description:
          type: string
        flag_type:
          type: string
          description: "bool, string, int, float"
        default_value:
          type: string

    UpdateFlagRequest:
      type: object
      properties:
        description:
          type: string
        default_value:
          type: string
        active:
          type: boolean
        rollout_pct:
          type: integer

    EvaluateFlagRequest:
      type: object
      required: [key, user_id]
      properties:
        key:
          type: string
        user_id:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string

    EvaluateFlagResponse:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        enabled:
          type: boolean

    FlagResponse:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        description:
          type: string
        flag_type:
          type: string
        default_value:
          type: string
        active:
          type: boolean
        rollout_pct:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Admin — Site Setting ────────────────────────────────────
    UpsertSettingRequest:
      type: object
      required: [key, value, setting_type]
      properties:
        key:
          type: string
        value:
          type: string
        setting_type:
          type: string
          description: "general, email, security, payment"
        description:
          type: string

    SettingResponse:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        value:
          type: string
        setting_type:
          type: string
        description:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    # ── Admin — Statistics ──────────────────────────────────────
    OverviewStats:
      type: object
      properties:
        total_users:
          type: integer
          format: int64
        total_accounts:
          type: integer
          format: int64
        active_accounts:
          type: integer
          format: int64
        total_transfers:
          type: integer
          format: int64
        total_cards:
          type: integer
          format: int64
        pending_kyc:
          type: integer
          format: int64
        flagged_fraud:
          type: integer
          format: int64
        system_errors_pending:
          type: integer
          format: int64

    # ── Admin — Integration ─────────────────────────────────────
    CreateIntegrationRequest:
      type: object
      required: [name, base_url, api_key, status]
      properties:
        name:
          type: string
        base_url:
          type: string
        api_key:
          type: string
        status:
          type: string
          description: "ACTIVE, INACTIVE, SUSPENDED"
        webhook_url:
          type: string

    UpdateIntegrationRequest:
      type: object
      properties:
        base_url:
          type: string
        api_key:
          type: string
        status:
          type: string
        webhook_url:
          type: string

    IntegrationResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        base_url:
          type: string
        api_key:
          type: string
        status:
          type: string
        webhook_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Admin — Audit ───────────────────────────────────────────
    AuditLogEntry:
      type: object
      properties:
        aggregate_type:
          type: string
        aggregate_id:
          type: string
        action:
          type: string
        actor_id:
          type: string
        attributes:
          type: object
          additionalProperties: true
        ip_address:
          type: string
        user_agent:
          type: string
        timestamp:
          type: string
          format: date-time

    # ── Ops — System Error ──────────────────────────────────────
    SystemErrorResponse:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          description: "CRITICAL, HIGH, MEDIUM, LOW"
        category:
          type: string
          description: "SYSTEM, DATA, EXTERNAL, NETWORK"
        stack_trace:
          type: string
        request_id:
          type: string
        user_id:
          type: string
        ip_address:
          type: string
        path:
          type: string
        method:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        resolution:
          type: string
        resolved_by:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Ops — Error Code ────────────────────────────────────────
    CreateErrorCodeRequest:
      type: object
      required: [code, message_en, category, severity, http_status]
      properties:
        code:
          type: string
        message_en:
          type: string
        message_uz:
          type: string
        message_ru:
          type: string
        category:
          type: string
          description: "VALIDATION, SECURITY, DATA, BUSINESS, SYSTEM"
        severity:
          type: string
          description: "CRITICAL, HIGH, MEDIUM, LOW, INFO"
        http_status:
          type: integer
        retryable:
          type: boolean
        suggestion:
          type: string

    UpdateErrorCodeRequest:
      type: object
      properties:
        message_en:
          type: string
        message_uz:
          type: string
        message_ru:
          type: string
        http_status:
          type: integer
        retryable:
          type: boolean
        suggestion:
          type: string

    ErrorCodeResponse:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        message_en:
          type: string
        message_uz:
          type: string
        message_ru:
          type: string
        category:
          type: string
        severity:
          type: string
        http_status:
          type: integer
        retryable:
          type: boolean
        suggestion:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Ops — Rate Limit ────────────────────────────────────────
    CreateRateLimitRequest:
      type: object
      required: [key, max_requests, window_seconds]
      properties:
        key:
          type: string
        max_requests:
          type: integer
        window_seconds:
          type: integer
        description:
          type: string
        enabled:
          type: boolean

    UpdateRateLimitRequest:
      type: object
      properties:
        max_requests:
          type: integer
        window_seconds:
          type: integer
        description:
          type: string
        enabled:
          type: boolean

    RateLimitResponse:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        max_requests:
          type: integer
        window_seconds:
          type: integer
        description:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Ops — App Metric ────────────────────────────────────────
    MetricResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: number
          format: double
        labels:
          type: object
          additionalProperties:
            type: string
        collected_at:
          type: string
          format: date-time

    # ── Admin — Dashboard ───────────────────────────────────────
    DashboardOverviewResponse:
      type: object
      properties:
        total_users:
          type: integer
          format: int64
        active_users:
          type: integer
          format: int64
        total_accounts:
          type: integer
          format: int64
        total_transfers:
          type: integer
          format: int64
        total_deposits:
          type: integer
          format: int64
        total_withdrawals:
          type: integer
          format: int64
        generated_at:
          type: string
          format: date-time

    DashboardPeriodStatsResponse:
      type: object
      properties:
        period:
          type: string
          description: "daily, weekly, monthly"
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        new_users:
          type: integer
          format: int64
        new_accounts:
          type: integer
          format: int64
        transactions:
          type: integer
          format: int64
        volume:
          type: integer
          format: int64

    # ── Admin — Currency ────────────────────────────────────────
    CreateCurrencyRequest:
      type: object
      required: [code, name, symbol, decimal_places]
      properties:
        code:
          type: string
        name:
          type: string
        symbol:
          type: string
        decimal_places:
          type: integer

    UpdateCurrencyRequest:
      type: object
      required: [id, name, symbol, decimal_places]
      properties:
        id:
          type: string
        name:
          type: string
        symbol:
          type: string
        decimal_places:
          type: integer

    ToggleCurrencyStatusRequest:
      type: object
      required: [id, active]
      properties:
        id:
          type: string
        active:
          type: boolean

    CurrencyResponse:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        symbol:
          type: string
        decimal_places:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Admin — Template ────────────────────────────────────────
    CreateTemplateRequest:
      type: object
      required: [slug, channel, subject, body, locale]
      properties:
        slug:
          type: string
        channel:
          type: string
          description: "EMAIL, SMS, PUSH"
        subject:
          type: string
        body:
          type: string
        locale:
          type: string
          description: "uz, ru, en"

    UpdateTemplateBodyRequest:
      type: object
      required: [id, subject, body]
      properties:
        id:
          type: string
        subject:
          type: string
        body:
          type: string

    TemplateIDRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string

    TemplateResponse:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        channel:
          type: string
        subject:
          type: string
        body:
          type: string
        locale:
          type: string
        status:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Admin — Healthcheck ─────────────────────────────────────
    ComponentCheckResponse:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        latency_ms:
          type: integer
          format: int64
        message:
          type: string
        checked_at:
          type: string
          format: date-time

    SystemHealthResponse:
      type: object
      properties:
        status:
          type: string
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentCheckResponse'
        checked_at:
          type: string
          format: date-time

    HealthRecordResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentCheckResponse'
        checked_at:
          type: string
          format: date-time

    # ── Ops — IP Rule ───────────────────────────────────────────
    CreateIPRuleRequest:
      type: object
      required: [ip_address, rule_type, reason]
      properties:
        ip_address:
          type: string
        rule_type:
          type: string
          description: "ALLOW or DENY"
        reason:
          type: string
        expires_at:
          type: string
          format: date-time

    IPRuleResponse:
      type: object
      properties:
        id:
          type: string
        ip_address:
          type: string
        rule_type:
          type: string
        reason:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

paths:
  # ════════════════════════════════════════════════════════════════
  #  HEALTH
  # ════════════════════════════════════════════════════════════════
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 if the process is alive
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Checks all dependencies (PostgreSQL, MongoDB, Kafka, Redis)
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ════════════════════════════════════════════════════════════════
  #  IAM — AUTH (Session BC)
  # ════════════════════════════════════════════════════════════════
  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      description: Authenticate with email and password. Returns JWT tokens or totp_required flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login successful (or TOTP required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (end single session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/totp/verify:
    post:
      tags: [Auth]
      summary: Verify TOTP code during login
      description: Complete login for accounts with TOTP enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPVerifyLoginRequest'
      responses:
        "200":
          description: TOTP verified, tokens returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Invalid TOTP code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Logout from all sessions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: All sessions terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/totp/setup:
    post:
      tags: [Auth - TOTP]
      summary: Start TOTP setup
      description: Generate TOTP secret and QR URL for authenticator app
      security:
        - BearerAuth: []
      responses:
        "200":
          description: TOTP secret and URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPSetupResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/totp/confirm:
    post:
      tags: [Auth - TOTP]
      summary: Confirm TOTP setup
      description: Verify first TOTP code to activate two-factor authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPVerifySetupRequest'
      responses:
        "200":
          description: TOTP enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/totp/disable:
    post:
      tags: [Auth - TOTP]
      summary: Disable TOTP
      description: Disable two-factor authentication (requires password confirmation)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPDisableRequest'
      responses:
        "200":
          description: TOTP disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ════════════════════════════════════════════════════════════════
  #  IAM — CHALLENGE (Step-up Auth)
  # ════════════════════════════════════════════════════════════════
  /auth/challenge/request:
    post:
      tags: [Challenge]
      summary: Request a step-up authentication challenge
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequestDTO'
      responses:
        "201":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/challenge/verify:
    post:
      tags: [Challenge]
      summary: Verify a step-up challenge
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeVerifyDTO'
      responses:
        "200":
          description: Challenge verified, token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeVerifiedResponse'
        "400":
          description: Invalid challenge or credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ════════════════════════════════════════════════════════════════
  #  IAM — USERS
  # ════════════════════════════════════════════════════════════════
  /users/get:
    get:
      tags: [Users]
      summary: Get user by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: User ID
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/change-password:
    post:
      tags: [Users]
      summary: Change password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/data-export:
    get:
      tags: [Users]
      summary: Export user data (GDPR)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User data export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/delete:
    delete:
      tags: [Users]
      summary: Delete account / anonymize data (GDPR)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account data anonymized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ════════════════════════════════════════════════════════════════
  #  IAM — CONTACTS
  # ════════════════════════════════════════════════════════════════
  /contacts/add:
    post:
      tags: [Contacts]
      summary: Add a contact
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddContactRequest'
      responses:
        "201":
          description: Contact added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contacts/list:
    get:
      tags: [Contacts]
      summary: List contacts (paginated)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Contact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contacts/delete:
    delete:
      tags: [Contacts]
      summary: Delete a contact
      security:
        - BearerAuth: []
      parameters:
        - name: contact_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ════════════════════════════════════════════════════════════════
  #  BANKING — ACCOUNTS
  # ════════════════════════════════════════════════════════════════
  /accounts/create:
    post:
      tags: [Accounts]
      summary: Create a new bank account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/get:
    get:
      tags: [Accounts]
      summary: Get account by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Account ID
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/list:
    get:
      tags: [Accounts]
      summary: List user accounts (paginated)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/deposit:
    post:
      tags: [Accounts]
      summary: Deposit funds
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        "200":
          description: Deposit successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/withdraw:
    post:
      tags: [Accounts]
      summary: Withdraw funds
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        "200":
          description: Withdrawal successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        "400":
          description: Insufficient funds or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/close:
    post:
      tags: [Accounts]
      summary: Close an account (balance must be 0)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseAccountRequest'
      responses:
        "200":
          description: Account closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
          description: Account has non-zero balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/history:
    get:
      tags: [Accounts]
      summary: Get account event history (event sourcing)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Account ID
      responses:
        "200":
          description: Event history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountEventResponse'
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ════════════════════════════════════════════════════════════════
  #  BANKING — TRANSFERS
  # ════════════════════════════════════════════════════════════════
  /transfers/send:
    post:
      tags: [Transfers]
      summary: Transfer funds between accounts
      description: HMAC-signed and idempotent (Idempotency-Key header)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTransferRequest'
      responses:
        "201":
          description: Transfer initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        "400":
          description: Validation error or insufficient funds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transfers/get:
    get:
      tags: [Transfers]
      summary: Get transfer by ID
