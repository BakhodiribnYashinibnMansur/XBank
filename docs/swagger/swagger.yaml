basePath: /api/v1
definitions:
  apperror.ErrorBody:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  apperror.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/apperror.ErrorBody'
      meta:
        $ref: '#/definitions/apperror.Meta'
      status:
        type: string
    type: object
  apperror.Meta:
    properties:
      correlation_id:
        type: string
      request_id:
        type: string
      timestamp:
        type: string
    type: object
  dto.AccountEventResponse:
    properties:
      data: {}
      id:
        type: string
      occurred_at:
        type: string
      type:
        type: string
      version:
        type: integer
    type: object
  dto.AccountResponse:
    properties:
      account_number:
        type: string
      balance:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  dto.ActivateCardRequest:
    properties:
      pin:
        description: 4 digits
        type: string
    type: object
  dto.AddBeneficiaryRequest:
    properties:
      account_number:
        type: string
      bank_code:
        type: string
      bank_name:
        type: string
      currency:
        type: string
      name:
        type: string
      type:
        description: INTERNAL, EXTERNAL, INTERNATIONAL
        type: string
    type: object
  dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.BeneficiaryResponse:
    properties:
      account_number:
        type: string
      bank_code:
        type: string
      bank_name:
        type: string
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        type: string
      verified:
        type: boolean
    type: object
  dto.CardResponse:
    properties:
      account_id:
        type: string
      card_type:
        type: string
      created_at:
        type: string
      expiry_month:
        type: integer
      expiry_year:
        type: integer
      id:
        type: string
      masked_pan:
        description: PAN never returned in full!
        type: string
      status:
        type: string
    type: object
  dto.ChangePINRequest:
    properties:
      new_pin:
        type: string
      old_pin:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  dto.CloseAccountRequest:
    properties:
      account_id:
        type: string
    type: object
  dto.ConvertRequest:
    properties:
      amount:
        type: integer
      from:
        type: string
      to:
        type: string
    type: object
  dto.ConvertResponse:
    properties:
      converted_amount:
        type: integer
      from:
        type: string
      original_amount:
        type: integer
      rate_used:
        type: integer
      to:
        type: string
    type: object
  dto.CreateAccountRequest:
    properties:
      currency:
        type: string
    type: object
  dto.DepositRequest:
    properties:
      account_id:
        type: string
      amount:
        type: integer
    type: object
  dto.FraudCheckResponse:
    properties:
      action:
        type: string
      created_at:
        type: string
      flags:
        items:
          type: string
        type: array
      id:
        type: string
      review_comment:
        type: string
      reviewed_by:
        type: string
      risk_level:
        type: string
      risk_score:
        type: integer
      transfer_id:
        type: string
      user_id:
        type: string
    type: object
  dto.IssueCardRequest:
    properties:
      account_id:
        type: string
      card_type:
        description: DEBIT, VIRTUAL
        type: string
    type: object
  dto.KYCResponse:
    properties:
      created_at:
        type: string
      document_type:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      rejected_reason:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
  dto.KYCReviewRequest:
    properties:
      reason:
        description: only for reject
        type: string
      verification_id:
        type: string
    type: object
  dto.KYCSubmitRequest:
    properties:
      date_of_birth:
        description: YYYY-MM-DD
        type: string
      document_number:
        type: string
      document_type:
        description: PASSPORT, ID_CARD, DRIVER_LICENSE
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.PaginatedResponse:
    properties:
      data: {}
      pagination:
        $ref: '#/definitions/dto.PaginationResponse'
    type: object
  dto.PaginationResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  dto.RateResponse:
    properties:
      buy_rate:
        type: integer
      from_currency:
        type: string
      id:
        type: string
      sell_rate:
        type: integer
      to_currency:
        type: string
      updated_at:
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
    type: object
  dto.SendTransferRequest:
    properties:
      amount:
        type: integer
      currency:
        type: string
      description:
        type: string
      from_account_id:
        type: string
      to_account_id:
        type: string
    type: object
  dto.TransferEventResponse:
    properties:
      data: {}
      id:
        type: string
      occurred_at:
        type: string
      type:
        type: string
      version:
        type: integer
    type: object
  dto.TransferResponse:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      failure_reason:
        type: string
      from_account_id:
        type: string
      id:
        type: string
      status:
        type: string
      to_account_id:
        type: string
    type: object
  dto.UpsertRateRequest:
    properties:
      buy_rate:
        type: integer
      from:
        type: string
      sell_rate:
        type: integer
      to:
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
    type: object
  dto.VerifyPINRequest:
    properties:
      pin:
        type: string
    type: object
  dto.WithdrawRequest:
    properties:
      account_id:
        type: string
      amount:
        type: integer
    type: object
host: localhost:3000
info:
  contact: {}
  description: XBank Banking API - DDD architecture with Go and Fiber
  title: XBank API
  version: "1.0"
paths:
  /accounts/close:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CloseAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Close an account (balance must be 0)
      tags:
      - Accounts
  /accounts/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Currency (UZS, USD, EUR)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new bank account
      tags:
      - Accounts
  /accounts/deposit:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account ID and amount (in minor units)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DepositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deposit funds
      tags:
      - Accounts
  /accounts/get:
    get:
      parameters:
      - description: Account ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AccountResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account by ID
      tags:
      - Accounts
  /accounts/history:
    get:
      parameters:
      - description: Account ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AccountEventResponse'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account event history
      tags:
      - Accounts
  /accounts/list:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: List user accounts (paginated)
      tags:
      - Accounts
  /accounts/withdraw:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account ID and amount (in minor units)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.WithdrawRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Withdraw funds
      tags:
      - Accounts
  /admin/fraud/check:
    get:
      parameters:
      - description: Transfer ID
        in: query
        name: transfer_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FraudCheckResponse'
      security:
      - BearerAuth: []
      summary: Get fraud check for a transfer
      tags:
      - Fraud
  /admin/fraud/flagged:
    get:
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: List flagged/blocked transactions (admin)
      tags:
      - Fraud
  /admin/kyc/approve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Verification ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.KYCReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve KYC (admin)
      tags:
      - KYC
  /admin/kyc/pending:
    get:
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: List pending KYC verifications (admin)
      tags:
      - KYC
  /admin/kyc/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: Verification ID + reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.KYCReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reject KYC (admin)
      tags:
      - KYC
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      summary: User login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout (end session)
      tags:
      - Auth
  /auth/logout-all:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout from all sessions
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /beneficiaries/add:
    post:
      consumes:
      - application/json
      parameters:
      - description: Beneficiary details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AddBeneficiaryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.BeneficiaryResponse'
      security:
      - BearerAuth: []
      summary: Add a beneficiary
      tags:
      - Beneficiaries
  /beneficiaries/delete:
    delete:
      parameters:
      - description: Beneficiary ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a beneficiary
      tags:
      - Beneficiaries
  /beneficiaries/list:
    get:
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: List beneficiaries (paginated)
      tags:
      - Beneficiaries
  /cards:
    get:
      parameters:
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: Cards for an account (paginated)
      tags:
      - Cards
    post:
      consumes:
      - application/json
      parameters:
      - description: Account ID and card type
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.IssueCardRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Issue a new card
      tags:
      - Cards
  /cards/{id}:
    get:
      parameters:
      - description: Card ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CardResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Card details by ID
      tags:
      - Cards
  /cards/{id}/activate:
    post:
      consumes:
      - application/json
      parameters:
      - description: Card ID
        in: path
        name: id
        required: true
        type: string
      - description: 4-digit PIN
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ActivateCardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Activate a card by setting PIN
      tags:
      - Cards
  /cards/{id}/block:
    post:
      parameters:
      - description: Card ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Block a card
      tags:
      - Cards
  /cards/{id}/pin:
    put:
      consumes:
      - application/json
      parameters:
      - description: Card ID
        in: path
        name: id
        required: true
        type: string
      - description: Old PIN and new PIN
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePINRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change card PIN
      tags:
      - Cards
  /cards/{id}/unblock:
    post:
      parameters:
      - description: Card ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Unblock a card
      tags:
      - Cards
  /cards/{id}/verify-pin:
    post:
      consumes:
      - application/json
      parameters:
      - description: Card ID
        in: path
        name: id
        required: true
        type: string
      - description: PIN
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyPINRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify card PIN
      tags:
      - Cards
  /currencies/convert:
    post:
      consumes:
      - application/json
      parameters:
      - description: Conversion details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ConvertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ConvertResponse'
      security:
      - BearerAuth: []
      summary: Convert currency
      tags:
      - Exchange
  /currencies/rate:
    get:
      parameters:
      - description: From currency (e.g. USD)
        in: query
        name: from
        required: true
        type: string
      - description: To currency (e.g. UZS)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
